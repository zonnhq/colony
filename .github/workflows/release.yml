name: Build install candidates

# This workflow never publishes a GitHub release. It produces install candidates
# for inspection. Publishing remains a separate, explicit operator action after
# clean-machine validation on all three operating systems.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in installer filenames
        required: true
        default: 0.1.2
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "node-gui/**"
      - "llm-runner/**"
      - "coordinator/**"

permissions:
  contents: read

jobs:
  node-installers:
    name: Zonn Node installer (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-amd64
            platform: linux/amd64
          - os: macos-15-intel
            label: macos-intel
            platform: darwin/amd64
            package_arch: intel
          - os: macos-15
            label: macos-apple-silicon
            platform: darwin/arm64
            package_arch: apple-silicon
          - os: windows-latest
            label: windows-x64
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    env:
      INSTALLER_VERSION: ${{ inputs.version || '0.1.2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: node-gui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-gui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate installer version
        shell: bash
        run: |
          if [[ ! "$INSTALLER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid installer version: $INSTALLER_VERSION"
            exit 1
          fi

      - name: Verify Node and Console theme parity
        run: node scripts/check-theme.mjs

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install build tools
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          python -m pip install --disable-pip-version-check pyinstaller numpy transformers
          if [ "${{ runner.os }}" = "Linux" ] || [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install --disable-pip-version-check torch
          fi

      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build bundled inference worker
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile \
            --name inference-worker \
            --distpath node-gui/build/worker \
            --workpath node-gui/build/pyinstaller-work \
            --specpath node-gui/build \
            llm-runner/inference_worker.py

      - name: Build desktop app
        working-directory: node-gui
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("wails.json")); p.info.productVersion=process.env.INSTALLER_VERSION; fs.writeFileSync("wails.json", JSON.stringify(p, null, 2)+"\n")'
          wails build -clean -trimpath -tags "desktop,webkit2_41" \
            -skipbindings -platform "${{ matrix.platform }}" \
            -webview2 embed -o zonn-node

      - name: Build Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x node-gui/build/linux/build-deb.sh
          node-gui/build/linux/build-deb.sh "$INSTALLER_VERSION"
          dpkg-deb --info "node-gui/build/installer/zonn-node_${INSTALLER_VERSION}_amd64.deb"
          dpkg-deb --contents "node-gui/build/installer/zonn-node_${INSTALLER_VERSION}_amd64.deb"

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x node-gui/build/darwin/build-dmg.sh
          node-gui/build/darwin/build-dmg.sh "$INSTALLER_VERSION" "${{ matrix.package_arch }}"
          hdiutil verify "node-gui/build/installer/Zonn-Node-${INSTALLER_VERSION}-macOS-${{ matrix.package_arch }}.dmg"

      - name: Build Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path "node-gui/build/bin").Path
          if (Test-Path "$sourceDir\zonn-node") {
            Move-Item "$sourceDir\zonn-node" "$sourceDir\zonn-node.exe"
          }
          Copy-Item "node-gui/build/worker/inference-worker.exe" "$sourceDir\inference-worker.exe"
          Copy-Item "llm-runner/inference_worker.py" "$sourceDir\inference_worker.py"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:INSTALLER_VERSION" `
            "/DSourceDir=$sourceDir" `
            "/DIconFile=$((Resolve-Path 'node-gui/build/zonn-node.ico').Path)" `
            "node-gui/build/windows/zonn-node.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload install candidate
        uses: actions/upload-artifact@v4
        with:
          name: zonn-node-${{ matrix.label }}-${{ env.INSTALLER_VERSION }}
          path: node-gui/build/installer/*
          if-no-files-found: error

  coordinator-binaries:
    name: Coordinator binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test and build
        working-directory: coordinator
        run: |
          go test ./...
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/coordinator-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/coordinator-darwin-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/coordinator-windows-amd64.exe ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: coordinator-install-candidates
          path: coordinator/dist/*
          if-no-files-found: error
